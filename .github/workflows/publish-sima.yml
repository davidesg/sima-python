name: Publish sima-tseries

# Trusted publishing (OIDC) on a `sima-v*` tag. Launched by hand
# (workflow_dispatch) it builds and validates without publishing.

on:
  push:
    tags: ["sima-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      # INSTALL AND IMPORT WHAT IS ABOUT TO BE PUBLISHED, in a clean
      # environment, from PyPI's dependencies. If drvarma 0.2.0 is not
      # published yet this fails and the release stops: better a blocked
      # release than a package nobody can install (art-tseries 0.1.3).
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/sima_tseries-*-py3-none-any.whl
          /tmp/clean/bin/python -c "import sima; print('sima-tseries', sima.__version__)"
          /tmp/clean/bin/python -c "import asyncio; from sima.mcp_server import mcp; \
                     n=len(asyncio.run(mcp.list_tools())); print('sima tools:', n); \
                     assert n >= 11, n"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/sima-v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
