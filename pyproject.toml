[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "sima-tseries"
version         = "0.2.1"
description     = "sima — the MCP assistant for simultaneous VARMA and cointegrated VARMA-VEC models on the ATSW ladder (engines: drvarma, drvec)"
readme          = "README.md"
license         = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
authors         = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords        = ["time series", "VARMA", "VEC", "cointegration", "multivariate", "Box-Jenkins", "MCP", "forecasting"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # >=0.2.0: the ladder (drvarma.ladder) and the engine API this assistant
    # calls (diagnostics.ccf/qccf/hosking_q, irf.oirf/fevd), declared there.
    # Its binary wheels carry the compiled likelihood the ladder needs for
    # speed: without it the ladder warns and runs ~250x slower.
    # >=0.3.0: GSL's eigensolvers, and forecast_given (the VEC in levels is
    # forecast by drvarma's forecaster: one forecaster, PLAN-vec decision 5)
    # >=0.3.1: the examples' job caches are keyed on it (jobs.make_key), and
    # 0.3.1 has the wheels for Python 3.14
    "drvarma>=0.3.1",
    # the cointegrated systems (VARMA-VEC by exact ML, the port of drvec C
    # 0.13): a hard dependency (PLAN-vec Q11); its wheels carry drvec C for
    # the long bootstraps
    "drvec>=0.1.0",
    # the reference parser of the univariate files, and the univariate cast
    # (>=0.1.18: the deterministic component by lib/fuedet, which drvec needs;
    # >=0.1.19: the examples' job caches are keyed on it, as on drvarma)
    "fue>=0.1.19",
    # the one graphics engine of the ladder: residual panels and the forecast
    "pyfug>=2.0.1",
    "numpy>=1.24",
    "scipy>=1.10",
    # mcp<2: mcp 2.0.0 removed `mcp.server.fastmcp` (art-tseries 0.1.3 shipped
    # broken for exactly this).
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# the raw-data entry (load_data, characterize) runs art's engine per series,
# and reads Excel with pandas; imported lazily, so the ladder works without it
# art-tseries >=0.2.3: the art this release is tested with (an open bound let an
# old art run the raw entry).
raw = ["art-tseries>=0.2.3", "pandas", "openpyxl"]

[project.urls]
Homepage = "https://github.com/davidesg/sima-python"
Repository = "https://github.com/davidesg/sima-python"
Issues = "https://github.com/davidesg/sima-python/issues"
Changelog = "https://github.com/davidesg/sima-python/blob/main/CHANGELOG.md"

[project.scripts]
sima = "sima.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# bugs/, docs/ and the worked examples, copied by tools/sync_material.py
# (generated, not in git): the MCP resources and load_example serve them, and a
# wheel only carries src/ (art BUG-0125).
[tool.setuptools.package-data]
sima = ["material/bugs/*.md", "material/docs/*.md",
        "material/examples/*/*.md", "material/examples/*/*.json",
        "material/examples/*/*/*.pre", "material/examples/*/*/*.out",
        "material/examples/*/*/*.csv",
        "material/examples/*/*/sima_jobs/*/*.json", "material/examples/*/*/sima_jobs/*/*.out",
        "material/examples/*/*/sima_jobs/*/*.boot", "material/examples/*/*/sima_jobs/*/*.irfboot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
