[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "sima-tseries"
version         = "0.1.0"
description     = "sima — the MCP assistant for simultaneous VARMA models on the ATSW ladder (engine: drvarma)"
readme          = "README.md"
license         = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
authors         = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords        = ["time series", "VARMA", "multivariate", "Box-Jenkins", "MCP", "forecasting"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # >=0.2.0: the ladder (drvarma.ladder) and the engine API this assistant
    # calls (diagnostics.ccf/qccf/hosking_q, irf.oirf/fevd), declared there.
    # Its binary wheels carry the compiled likelihood the ladder needs for
    # speed: without it the ladder warns and runs ~250x slower.
    "drvarma>=0.2.0",
    # the reference parser of the univariate files, and the univariate cast
    "fue>=0.1.16",
    "numpy>=1.24",
    "scipy>=1.10",
    # mcp<2: mcp 2.0.0 removed `mcp.server.fastmcp` (art-tseries 0.1.3 shipped
    # broken for exactly this).
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/davidesg/sima"

[project.scripts]
sima = "sima.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# bugs/ and docs/, copied by tools/sync_material.py (generated, not in git):
# the MCP resources serve them, and a wheel only carries src/ (art BUG-0125).
[tool.setuptools.package-data]
sima = ["material/bugs/*.md", "material/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
